# Reject unknown and missing SNI. Validate with real Reality handshakes.
server {
    listen 127.0.0.1:8443 ssl default_server;
    ssl_reject_handshake on;
}
# reality-site — local HTTPS static blog (Reality fallback target).
# Only bound to loopback; never exposed to the public internet directly.
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name __DOMAIN__;

    # ACME-issued certificate (shared with Hysteria2).
    ssl_certificate     __CERT_FULLCHAIN__;
    ssl_certificate_key __CERT_KEY__;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root __SITE_CURRENT__;
    index index.html;

    # Never expose directory listings or dotfiles.
    autoindex off;
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reasonable limits for a static site. All clients arrive via 127.0.0.1
    # (Reality target), so per-IP rate limits would be meaningless here.
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30;
    sendfile on;
    tcp_nopush on;

    # Do not log full URIs of every static asset in production.
    access_log /var/log/nginx/reality-site.access.log;
    error_log  /var/log/nginx/reality-site.error.log warn;

    add_header X-Content-Type-Options nosniff always;
}
